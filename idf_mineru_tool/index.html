        /\b\d{2,4}-[A-Z0-9]+-[A-Z0-9]+-[A-Z0-9_\/\\-]+\b/g,
        /\b[A-Z0-9]{1,8}(?:[-\/\\][A-Z0-9_]+){2,}\b/g
      ];
      for (const pattern of patterns) {
        const matches = joined.match(pattern) || [];
        const best = matches
          .map(item => item.replace(/\s+/g, ''))
          .filter(item => item.includes('-') && /[A-Z]/.test(item) && /\d/.test(item))
          .sort((a, b) => b.length - a.length)[0];
        if (best) return best;
      }
      return '';
    }

    function normalizeCoordinateLines(text) {
      return String(text || '')
        .replace(/\r/g, '\n')
        .replace(/[：:]/g, ' ')
        .split(/\n+/)
        .map(cleanLine)
        .flatMap(line => line.split(/\s{2,}|\t+/))
        .map(line => normalizeText(line).toUpperCase())
        .filter(Boolean);
    }

    function extractCoordinateBlocks(text, options = {}) {
      const allowInferred = !!options.allowInferred;
      const markdown = String(text || '')
        .normalize('NFKC')
        .replace(/\r/g, '\n')
        .replace(/[：:]/g, ' ');
      const tokens = [];
      const pattern = /(?:^|[^A-Z0-9])(EL|E|S)(?:\b|(?=[+-]?\d))\s*([+-]?\d+(?:\.\d+)?)/gim;
      let match;
      while ((match = pattern.exec(markdown))) {
        tokens.push({
          index: match.index,
          label: match[1].toUpperCase(),
          value: match[2]
        });
      }

      const blocks = [];
      const seen = new Set();
      const addBlock = (e, s, el, options = {}) => {
        const key = `${e}|${s}|${el}`;
        if (seen.has(key)) return;
        blocks.push({
          e,
          s,
          el,
          key,
          numericKey: `${normalizeCoordinateNumber(e)}|${normalizeCoordinateNumber(s)}|${normalizeCoordinateNumber(el)}`,
          inferred: !!options.inferred,
          text: `E ${e}\nS ${s}\nEL ${el}`
        });
        seen.add(key);
      };
      for (let i = 0; i < tokens.length - 2; i += 1) {
        const a = tokens[i], b = tokens[i + 1], c = tokens[i + 2];
        if (a.label === 'E' && b.label === 'S' && c.label === 'EL') {
          addBlock(a.value, b.value, c.value);
          i += 2;
        }
      }
      if (allowInferred) {
      const lineTokens = normalizeCoordinateLines(markdown)
        .map(line => {
          const labelMatch = line.match(/^(EL|E|S)\s*[:：-]?\s*([+-]?\d+(?:\.\d+)?)$/i);
          if (labelMatch) return { label: labelMatch[1].toUpperCase(), value: labelMatch[2] };
          const numberMatch = line.match(/^([+-]?\d{4,}(?:\.\d+)?)$/);
          return numberMatch ? { label: '', value: numberMatch[1] } : null;
        })
        .filter(Boolean);
      for (let i = 0; i < lineTokens.length - 2; i += 1) {
        const group = [lineTokens[i], lineTokens[i + 1], lineTokens[i + 2]];
        const expected = ['E', 'S', 'EL'];
        const compatible = group.every((item, index) => !item.label || item.label === expected[index]);
          const hasMissingLabel = group.some(item => !item.label);
          const elHasPlusSign = /^\+/.test(String(group[2].value || '').trim());
          if (!compatible || !hasMissingLabel || !elHasPlusSign) continue;
        addBlock(group[0].value, group[1].value, group[2].value, { inferred: true });
        i += 2;
      }
      }
      return blocks;
    }

    function normalizeCoordinateNumber(value) {
      const text = String(value || '').trim();
      const number = Number(text);
      if (!Number.isFinite(number)) return text.replace(/^\+/, '');
      return String(number);
    }

    function normalizeMarkerLine(line) {
      return normalizeText(cleanLine(line))
        .toUpperCase()
        .replace(/[‘’“”"'`]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function isConnToLine(line) {
      return /\bCONN\.?\s*TO\b/.test(line);
    }

    function isContFromLine(line) {
      return /\bCONT\.?\s*FROM\b/.test(line);
    }

    function extractTrailingPageNumber(line) {
      const match = String(line || '').match(/\b(\d{1,4})\b\s*$/);
      return match ? Number(match[1]) : null;
    }

    function findNextStandalonePageNumber(lines, startIndex) {
      for (let index = startIndex + 1; index < Math.min(lines.length, startIndex + 5); index += 1) {
        const line = lines[index];
        if (!line) continue;
        const exact = line.match(/^(\d{1,4})$/);
        if (exact) return Number(exact[1]);
        if (/[A-Z]/.test(line) && line.includes('-')) return null;
      }
      return null;
    }

    function extractConnectionMarkers(text, page) {
      const lines = String(text || '')
        .replace(/\r/g, '\n')
        .split(/\n+/)
        .map(normalizeMarkerLine)
        .filter(Boolean);
      const markers = [];
      lines.forEach((line, index) => {
        let type = '';
        if (isConnToLine(line)) type = 'connTo';
        if (isContFromLine(line)) type = 'contFrom';
        if (!type) return;
        const linkedPage = extractTrailingPageNumber(line) || findNextStandalonePageNumber(lines, index);
        if (!Number.isInteger(linkedPage) || linkedPage <= 0) return;
        markers.push({ type, page, linkedPage, sourceLine: line });
      });
      return markers;
    }

    function coordinateMapByNumericKey(blocks) {
      const map = new Map();
      (blocks || []).forEach(block => {
        const key = block.numericKey || `${normalizeCoordinateNumber(block.e)}|${normalizeCoordinateNumber(block.s)}|${normalizeCoordinateNumber(block.el)}`;
        if (!map.has(key)) map.set(key, block);
      });
      return map;
    }

    function withCoordinatePage(block, page) {
      return { ...(block || {}), page };
    }

    function findCoordinateMatchesBetweenPages(fromJob, toJob) {
      const fromMap = coordinateMapByNumericKey(fromJob.coordinateBlocks || []);
      const toMap = coordinateMapByNumericKey(toJob.coordinateBlocks || []);
      const exact = [];
      fromMap.forEach((fromBlock, key) => {
        const toBlock = toMap.get(key);
        if (!toBlock) return;
        exact.push({
          e: fromBlock.e,
          s: fromBlock.s,
          el: fromBlock.el,
          matchType: (fromBlock.inferred || toBlock.inferred) ? '数值一致匹配' : '连接关系匹配',
          coordinateBlocks: [
            withCoordinatePage(fromBlock, fromJob.page),
            withCoordinatePage(toBlock, toJob.page)
          ]
        });
      });
      if (exact.length) return exact;

      const tolerance = [];
      const usedToKeys = new Set();
      fromMap.forEach(fromBlock => {
        const fromEl = Number(fromBlock.el);
        if (!Number.isFinite(fromEl)) return;
        let best = null;
        toMap.forEach((toBlock, toKey) => {
          if (usedToKeys.has(toKey)) return;
          if (normalizeCoordinateNumber(fromBlock.e) !== normalizeCoordinateNumber(toBlock.e)) return;
          if (normalizeCoordinateNumber(fromBlock.s) !== normalizeCoordinateNumber(toBlock.s)) return;
          const toEl = Number(toBlock.el);
          if (!Number.isFinite(toEl)) return;
          const diff = Math.abs(fromEl - toEl);
          if (diff >= 200) return;
          if (!best || diff < best.diff) best = { toKey, toBlock, diff };
        });
        if (!best) return;
        usedToKeys.add(best.toKey);
        tolerance.push({
          e: fromBlock.e,
          s: fromBlock.s,
          el: fromBlock.el,
          matchType: 'EL阈值匹配',
          elDifference: best.diff,
          coordinateBlocks: [
            withCoordinatePage(fromBlock, fromJob.page),
            withCoordinatePage(best.toBlock, toJob.page)
          ]
        });
      });
      return tolerance;
    }

    function buildConnectionPairsLegacyAbsolutePages(jobs) {
      const jobByPage = new Map();
      jobs.forEach(job => jobByPage.set(job.page, job));
      const seen = new Set();
      const pairs = [];
      const missingRelations = [];
      jobs.forEach(job => {
        (job.connectionMarkers || []).filter(marker => marker.type === 'connTo').forEach(marker => {
          const targetJob = jobByPage.get(marker.linkedPage);
          const pairKey = `${job.page}->${marker.linkedPage}`;
          if (seen.has(pairKey)) return;
          seen.add(pairKey);
          if (!targetJob) {
            missingRelations.push({
              pipeline: job.pipelineNumber || '',
              pages: `${job.page}, ${marker.linkedPage}`,
              expected: 1,
              found: 0,
              missing: 1,
              reason: `第 ${marker.linkedPage} 页未识别`
            });
            return;
          }
          const reverse = (targetJob.connectionMarkers || []).some(item =>
            item.type === 'contFrom' && item.linkedPage === job.page
          );
          const samePipeline = !job.pipelineNumber || !targetJob.pipelineNumber || job.pipelineNumber === targetJob.pipelineNumber;
          if (!reverse) {
            missingRelations.push({
              pipeline: job.pipelineNumber || targetJob.pipelineNumber || '',
              pages: `${job.page}, ${targetJob.page}`,
              expected: 1,
              found: 0,
              missing: 1,
              reason: `第 ${targetJob.page} 页缺少 CONT. FROM ${job.page}`
            });
            return;
          }
          if (!samePipeline) {
            missingRelations.push({
              pipeline: `${job.pipelineNumber || '未识别'} / ${targetJob.pipelineNumber || '未识别'}`,
              pages: `${job.page}, ${targetJob.page}`,
              expected: 1,
              found: 0,
              missing: 1,
              reason: '两页管线号不一致'
            });
            return;
          }
          pairs.push({ fromJob: job, toJob: targetJob });
        });
      });
      return { pairs, missingRelations };
    }

    function buildConnectionPairs(jobs) {
      const groups = new Map();
      jobs.forEach(job => {
        if (!job.pipelineNumber) return;
        if (!groups.has(job.pipelineNumber)) groups.set(job.pipelineNumber, []);
        groups.get(job.pipelineNumber).push(job);
      });
      groups.forEach(list => list.sort((a, b) => a.page - b.page));

      const seen = new Set();
      const pairs = [];
      const missingRelations = [];
      jobs.forEach(job => {
        (job.connectionMarkers || []).filter(marker => marker.type === 'connTo').forEach(marker => {
          if (!job.pipelineNumber) {
            missingRelations.push({
              pipeline: '未识别',
              pages: String(job.page),
              expected: 1,
              found: 0,
              missing: 1,
              reason: `第 ${job.page} 页有 CONN. TO ${marker.linkedPage}，但管线号未识别`
            });
            return;
          }
          const orderedJobs = groups.get(job.pipelineNumber) || [];
          if (orderedJobs.length <= 1) return;
          const sourceOrdinal = orderedJobs.findIndex(item => item.page === job.page) + 1;
          const targetJob = orderedJobs[marker.linkedPage - 1];
          const pairKey = `${job.pipelineNumber}|${job.page}->${marker.linkedPage}`;
          if (seen.has(pairKey)) return;
          seen.add(pairKey);

          if (!targetJob) {
            return;
          }
          if (targetJob.page === job.page) {
            missingRelations.push({
              pipeline: job.pipelineNumber,
              pages: String(job.page),
              expected: 1,
              found: 0,
              missing: 1,
              reason: `CONN. TO ${marker.linkedPage} 指向当前页`
            });
            return;
          }
          const reverse = (targetJob.connectionMarkers || []).some(item =>
            item.type === 'contFrom' && item.linkedPage === sourceOrdinal
          );
          if (!reverse) {
            missingRelations.push({
              pipeline: job.pipelineNumber,
              pages: `${job.page}, ${targetJob.page}`,
              expected: 1,
              found: 0,
              missing: 1,
              reason: `第 ${targetJob.page} 页缺少 CONT. FROM ${sourceOrdinal}`
            });
            return;
          }
          pairs.push({ fromJob: job, toJob: targetJob });
        });
      });
      return { pairs, missingRelations };
    }

    function collectRepeatedCoordinateFallback(jobs, existingRows) {
      const existing = new Set((existingRows || []).map(row =>
        `${row.pipeline}|${normalizeCoordinateNumber(row.e)}|${normalizeCoordinateNumber(row.s)}|${normalizeCoordinateNumber(row.el)}|${row.pages}`
      ));
      const pagesByPipeline = new Map();
      const coordsByPipeline = new Map();
      const sourceByPipeline = new Map();
      jobs.forEach(job => {
        if (!job.pipelineNumber) return;
        if (!sourceByPipeline.has(job.pipelineNumber)) sourceByPipeline.set(job.pipelineNumber, job.sourcePdf || '');
        if (!pagesByPipeline.has(job.pipelineNumber)) pagesByPipeline.set(job.pipelineNumber, new Set());
        pagesByPipeline.get(job.pipelineNumber).add(job.page);
        if (!coordsByPipeline.has(job.pipelineNumber)) coordsByPipeline.set(job.pipelineNumber, new Map());
        const coordMap = coordsByPipeline.get(job.pipelineNumber);
        (job.coordinateBlocks || []).forEach(block => {
          const key = block.numericKey || `${normalizeCoordinateNumber(block.e)}|${normalizeCoordinateNumber(block.s)}|${normalizeCoordinateNumber(block.el)}`;
          if (!coordMap.has(key)) coordMap.set(key, { ...block, pages: new Set(), hasInferred: !!block.inferred });
          coordMap.get(key).pages.add(job.page);
          if (block.inferred) coordMap.get(key).hasInferred = true;
        });
      });

      const fallbackRows = [];
      pagesByPipeline.forEach((pages, pipeline) => {
        if (pages.size <= 1) return;
        const coordMap = coordsByPipeline.get(pipeline) || new Map();
        coordMap.forEach(block => {
          if (block.pages.size < 2) return;
          const pageText = Array.from(block.pages).sort((a, b) => a - b).join(', ');
          const rowKey = `${pipeline}|${normalizeCoordinateNumber(block.e)}|${normalizeCoordinateNumber(block.s)}|${normalizeCoordinateNumber(block.el)}|${pageText}`;
          if (existing.has(rowKey)) return;
          fallbackRows.push({
            sourcePdf: sourceByPipeline.get(pipeline) || '',
            pipeline,
            e: block.e,
            s: block.s,
            el: block.el,
            pages: pageText,
            matchType: block.hasInferred ? '兜底-数值一致' : '兜底-重复坐标'
          });
        });
      });
      return fallbackRows;
    }

    function analyzeSplitPointsLegacyPageCount(jobs) {
      const pagesByPipeline = new Map();
      const coordsByPipeline = new Map();
      const sourceByPipeline = new Map();
      const confirmedEmptyPagesByPipeline = new Map();
      jobs.forEach(job => {
        if (!job.pipelineNumber) return;
        if (!sourceByPipeline.has(job.pipelineNumber)) sourceByPipeline.set(job.pipelineNumber, job.sourcePdf || '');
        if (!pagesByPipeline.has(job.pipelineNumber)) pagesByPipeline.set(job.pipelineNumber, new Set());
        pagesByPipeline.get(job.pipelineNumber).add(job.page);
        if (!confirmedEmptyPagesByPipeline.has(job.pipelineNumber)) confirmedEmptyPagesByPipeline.set(job.pipelineNumber, new Set());
        if ((job.coordinateBlocks || []).length === 0 && (job.splitPointAttempts || []).length >= 2) {
          confirmedEmptyPagesByPipeline.get(job.pipelineNumber).add(job.page);
        }
        if (!coordsByPipeline.has(job.pipelineNumber)) coordsByPipeline.set(job.pipelineNumber, new Map());
        const coordMap = coordsByPipeline.get(job.pipelineNumber);
        job.coordinateBlocks.forEach(block => {
          if (!coordMap.has(block.key)) coordMap.set(block.key, { ...block, pages: new Set() });
          coordMap.get(block.key).pages.add(job.page);
          if (block.inferred) coordMap.get(block.key).hasInferred = true;
        });
      });
      const repeated = [];
      const missing = [];
      pagesByPipeline.forEach((pages, pipeline) => {
        const confirmedEmptyPages = confirmedEmptyPagesByPipeline.get(pipeline) || new Set();
        const expected = Math.max(0, pages.size - 1 - confirmedEmptyPages.size);
        const found = [];
        let semanticFoundCount = 0;
        const coordMap = coordsByPipeline.get(pipeline) || new Map();
        coordMap.forEach(block => {
          if (block.pages.size >= 2) {
            found.push({
              sourcePdf: sourceByPipeline.get(pipeline) || '',
              pipeline,
              e: block.e,
              s: block.s,
              el: block.el,
              pages: Array.from(block.pages).sort((a, b) => a - b).join(', ')
              ,
              matchType: block.hasInferred ? '数值一致匹配' : '完整坐标匹配'
            });
            semanticFoundCount += 1;
          }
        });

        // Exact E/S/EL matches take priority. Only unmatched single-page blocks
        // use the EL tolerance fallback, and one matched pair is one split point.
        if (semanticFoundCount < expected) {
          const candidates = [];
          coordMap.forEach(block => {
            if (block.pages.size !== 1) return;
            const page = Array.from(block.pages)[0];
            const elValue = Number(block.el);
            if (!Number.isFinite(elValue)) return;
            candidates.push({ block, page, elValue });
          });

          const used = new Set();
          for (let i = 0; i < candidates.length && semanticFoundCount < expected; i += 1) {
            if (used.has(i)) continue;
            const current = candidates[i];
            let bestIndex = -1;
            let bestDifference = Infinity;
            for (let j = i + 1; j < candidates.length; j += 1) {
              if (used.has(j)) continue;
              const other = candidates[j];
              if (current.page === other.page) continue;
              if (current.block.e !== other.block.e || current.block.s !== other.block.s) continue;
              const difference = Math.abs(current.elValue - other.elValue);
              if (difference < 200 && difference < bestDifference) {
                bestDifference = difference;
                bestIndex = j;
              }
            }
            if (bestIndex < 0) continue;

            const other = candidates[bestIndex];
            used.add(i);
            used.add(bestIndex);
            const pairItems = [current, other].sort((a, b) => a.page - b.page);
            found.push({
              sourcePdf: sourceByPipeline.get(pipeline) || '',
              pipeline,
              e: current.block.e,
              s: current.block.s,
              el: current.block.el,
              pages: pairItems.map(item => item.page).join(', '),
              matchType: 'EL阈值匹配',
              elDifference: bestDifference,
              coordinateBlocks: pairItems.map(item => withCoordinatePage(item.block, item.page))
            });
            semanticFoundCount += 1;
          }
        }
        repeated.push(...found);
        if (semanticFoundCount < expected) {
          missing.push({
            sourcePdf: sourceByPipeline.get(pipeline) || '',
            pipeline,
            pages: Array.from(pages).sort((a, b) => a - b).join(', '),
            pageCount: pages.size,
            emptyCoordinatePages: Array.from(confirmedEmptyPages).sort((a, b) => a - b).join(', '),
            expected,
            found: semanticFoundCount,
            missing: expected - semanticFoundCount
          });
        }
      });
      return { repeated, missing };
    }

    function analyzeSplitPointsLegacyConnections(jobs) {
      const repeated = [];
      const missing = [];
      const { pairs, missingRelations } = buildConnectionPairs(jobs);
      pairs.forEach(pair => {
        const matches = findCoordinateMatchesBetweenPages(pair.fromJob, pair.toJob);
        if (!matches.length) {
          missing.push({
            sourcePdf: pair.fromJob.sourcePdf || pair.toJob.sourcePdf || '',
            pipeline: pair.fromJob.pipelineNumber || pair.toJob.pipelineNumber || '未识别',
            pages: `${pair.fromJob.page}, ${pair.toJob.page}`,
            pageCount: 2,
            emptyCoordinatePages: [pair.fromJob, pair.toJob]
              .filter(job => !(job.coordinateBlocks || []).length)
              .map(job => job.page)
              .join(', '),
            expected: 1,
            found: 0,
            missing: 1,
            reason: '连接关系已配对，但两页没有匹配坐标块'
          });
          return;
        }
        matches.forEach(match => {
          repeated.push({
            sourcePdf: pair.fromJob.sourcePdf || pair.toJob.sourcePdf || '',
            pipeline: pair.fromJob.pipelineNumber || pair.toJob.pipelineNumber || '未识别',
            e: match.e,
            s: match.s,
            el: match.el,
            pages: `${pair.fromJob.page}, ${pair.toJob.page}`,
            matchType: match.matchType,
            elDifference: match.elDifference,
            coordinateBlocks: match.coordinateBlocks || []
          });
        });
      });
      repeated.push(...collectRepeatedCoordinateFallback(jobs, repeated));
      missing.push(...missingRelations.map(row => ({
        sourcePdf: '',
        pageCount: 2,
        emptyCoordinatePages: '',
        ...row
      })));
      return { repeated, missing };
    }

    function analyzeSplitPoints(jobs) {
      const repeated = [];
      const missing = [];
      const { pairs, missingRelations } = buildConnectionPairs(jobs);
      const jobsByPipeline = new Map();
      const pairsByPipeline = new Map();

      (jobs || []).forEach(job => {
        if (!job.pipelineNumber) return;
        if (!jobsByPipeline.has(job.pipelineNumber)) jobsByPipeline.set(job.pipelineNumber, []);
        jobsByPipeline.get(job.pipelineNumber).push(job);
      });
      pairs.forEach(pair => {
        const pipeline = pair.fromJob.pipelineNumber || pair.toJob.pipelineNumber;
        if (!pipeline) return;
        if (!pairsByPipeline.has(pipeline)) pairsByPipeline.set(pipeline, []);
        pairsByPipeline.get(pipeline).push(pair);
      });

      const rowsByPipeline = new Map();
      pairs.forEach(pair => {
        const pipeline = pair.fromJob.pipelineNumber || pair.toJob.pipelineNumber || '未识别';
        const matches = findCoordinateMatchesBetweenPages(pair.fromJob, pair.toJob);
        if (!matches.length) return;

        // A matched CONN. TO / CONT. FROM pair represents one split point.
        const match = matches.find(item => !item.elDifference) || matches[0];
        const row = {
          sourcePdf: pair.fromJob.sourcePdf || pair.toJob.sourcePdf || '',
          pipeline,
          e: match.e,
          s: match.s,
          el: match.el,
          pages: `${pair.fromJob.page}, ${pair.toJob.page}`,
          matchType: `${match.matchType || '坐标匹配'} · CONN/CONT 第${pair.fromJob.page}↔${pair.toJob.page}页`,
          elDifference: match.elDifference,
          coordinateBlocks: match.coordinateBlocks || [],
          evidence: `CONN. TO / CONT. FROM：第 ${pair.fromJob.page} 页 ↔ 第 ${pair.toJob.page} 页`
        };
        repeated.push(row);
        if (!rowsByPipeline.has(pipeline)) rowsByPipeline.set(pipeline, []);
        rowsByPipeline.get(pipeline).push(row);
      });

      const fallbackRows = collectRepeatedCoordinateFallback(jobs, repeated);
      jobsByPipeline.forEach((pipelineJobs, pipeline) => {
        const distinctPages = new Set(pipelineJobs.map(job => job.page));
        // Repeated pipeline numbers confirm that split points exist even when
        // one of the pages failed to yield a coordinate block.
        const minimumExpected = Math.max(0, distinctPages.size - 1);
        const connectionExpected =
          (pairsByPipeline.get(pipeline) || []).length +
          missingRelations.filter(row => row.pipeline === pipeline).length;
        const expected = Math.max(minimumExpected, connectionExpected);
        const pipelineRows = rowsByPipeline.get(pipeline) || [];

        if (pipelineRows.length < expected) {
          const candidates = fallbackRows.filter(row => row.pipeline === pipeline);
          for (const row of candidates) {
            if (pipelineRows.length >= expected) break;
            const duplicate = pipelineRows.some(existing =>
              normalizeCoordinateNumber(existing.e) === normalizeCoordinateNumber(row.e) &&
              normalizeCoordinateNumber(existing.s) === normalizeCoordinateNumber(row.s) &&
              normalizeCoordinateNumber(existing.el) === normalizeCoordinateNumber(row.el) &&
              existing.pages === row.pages
            );
            if (duplicate) continue;
            repeated.push(row);
            row.evidence = '页数兜底：跨页重复坐标';
            pipelineRows.push(row);
          }
        }

        if (pipelineRows.length < expected) {
          missing.push({
            sourcePdf: pipelineJobs[0]?.sourcePdf || '',
            pipeline,
            pages: Array.from(distinctPages).sort((a, b) => a - b).join(', '),
            pageCount: distinctPages.size,
            emptyCoordinatePages: pipelineJobs
              .filter(job => !(job.coordinateBlocks || []).length)
              .map(job => job.page)
              .join(', '),
            expected,
            found: pipelineRows.length,
            missing: expected - pipelineRows.length,
            reason: connectionExpected > minimumExpected
              ? '按连接关系仍有分图点未找到'
              : '按页数最低数量仍有分图点未找到'
          });
        }
      });

      missingRelations
        .filter(row => !jobsByPipeline.has(row.pipeline))
        .forEach(row => missing.push({
          sourcePdf: '',
          pageCount: 2,
          emptyCoordinatePages: '',
          ...row
        }));
      return { repeated, missing };
    }

        function buildResultText(jobs) {
      const lines = ['# 已识别记录'];
      jobs.forEach(job => {
        lines.push(`第 ${job.page} 页`);
        lines.push(`管线号：${job.pipelineNumber || '未识别'}`);
        lines.push(`坐标块：${job.coordinateBlocks.length}`);
        job.coordinateBlocks.forEach(block => lines.push(`  E ${block.e} / S ${block.s} / EL ${block.el}`));
      });
      const { repeated, missing } = analyzeSplitPoints(jobs);
      lines.push('', '# 跨页重复分图点');
      if (!repeated.length) lines.push('未找到跨页重复分图点。');
      repeated.forEach(row => {
        const label = row.elDifference != null ? `EL阈值匹配（差值 ${row.elDifference}）` : '坐标匹配';
        if (row.elDifference != null) {
          const coords = normalizeRowCoordinateTargets(row).map((block, index) =>
            `坐标${index + 1}${block.page ? ` 第${block.page}页` : ''}: E ${block.e} / S ${block.s} / EL ${block.el}`
          ).join('；');
          lines.push(`${row.sourcePdf} | ${row.pipeline} | ${coords} | 页: ${row.pages} | ${label}`);
        } else {
          lines.push(`${row.sourcePdf} | ${row.pipeline} | E ${row.e} | S ${row.s} | EL ${row.el} | 页: ${row.pages} | ${label}`);
        }
      });
      lines.push('', '# 未找到分图点的管线');
      if (!missing.length) lines.push('无。');
      missing.forEach(row => lines.push(`${row.sourcePdf} | ${row.pipeline} | 全部页码 ${row.pages} | 空坐标页 ${row.emptyCoordinatePages || '-'} | 出现页数 ${row.pageCount} | 应有 ${row.expected} | 已找到 ${row.found} | 缺少 ${row.missing}`));
      return lines.join('\n');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function buildResultHtml(jobs) {
      const { repeated, missing } = analyzeSplitPoints(jobs);
      const pageTextHtml = (jobs || []).filter(job =>
        Array.isArray(job.coordinateBlocks) && job.coordinateBlocks.length > 0
      ).map(job => {
        const blocks = Array.isArray(job.coordinateBlocks) ? job.coordinateBlocks : [];
        const coordinates = blocks.map((block, index) => `
              <div class="pageTextCoord">${index + 1}. E ${escapeHtml(block.e)} / S ${escapeHtml(block.s)} / EL ${escapeHtml(block.el)}</div>
            `).join('');
        return `
          <div class="pageTextResult">
            <div class="pageTextHeader">第 ${escapeHtml(job.page)} 页　${escapeHtml(job.pipelineNumber || '未识别管线号')}</div>
            ${coordinates}
          </div>
        `;
      }).join('');
      const repeatedHtml = repeated.length
        ? `<div class="resultSplitGrid">${repeated.map((row, index) => {
          const coordinateTargets = normalizeRowCoordinateTargets(row);
          const coordinateHtml = coordinateTargets.map((block, blockIndex) => `
              <div class="splitPointCoordLine">
                ${row.elDifference != null ? `<span class="splitPointCoordIndex">坐标${blockIndex + 1}${block.page ? `/${escapeHtml(block.page)}页` : ''}</span>` : ''}
                <span><span class="coordLabel">E</span> ${escapeHtml(block.e)}</span>
                <span><span class="coordLabel">S</span> ${escapeHtml(block.s)}</span>
                <span><span class="coordLabel">EL</span> ${escapeHtml(block.el)}</span>
              </div>
            `).join('');
          return `
          <div class="splitPointCard${row.elDifference != null ? ' inferred' : ''}">
            <div class="splitPointTitle">
              <span>分图点 ${index + 1}</span>
              <span>${escapeHtml(row.pipeline)}</span>
            </div>
            <div class="splitPointCoords${row.elDifference != null ? ' multi' : ''}">
              ${coordinateHtml}
            </div>
            <div class="splitPointMeta">页码: ${escapeHtml(row.pages)}${row.elDifference != null ? ` | EL阈值匹配（差值 ${escapeHtml(row.elDifference)}）` : ' | 坐标匹配'}</div>
          </div>
        `; }).join('')}</div>`
        : '<div class="resultMuted">未找到跨页重复分图点。</div>';
      const missingHtml = missing.length
        ? missing.map(row => `<div class="resultLine">${escapeHtml(row.sourcePdf)} | ${escapeHtml(row.pipeline)} | 全部页码 ${escapeHtml(row.pages)} | 空坐标页 ${escapeHtml(row.emptyCoordinatePages || '-')} | 应有 ${escapeHtml(row.expected)} | 已找到 ${escapeHtml(row.found)} | 缺少 ${escapeHtml(row.missing)}</div>`).join('')
        : '<div class="resultMuted">无。</div>';
      const unmarkedHtml = ocrUnmarkedCoordinateBlocks.length
        ? ocrUnmarkedCoordinateBlocks.map(item => {
          const block = item.block || {};
          const indexText = Number.isInteger(item.rowIndex) ? `分图点 ${item.rowIndex + 1}${Number.isInteger(item.targetIndex) ? `-${item.targetIndex + 1}` : ''}` : '分图点';
          return `<div class="resultLine">第 ${escapeHtml(item.page)} 页 | ${escapeHtml(item.pipeline || '未识别管线号')} | ${escapeHtml(indexText)} | E ${escapeHtml(block.e || '-')} | S ${escapeHtml(block.s || '-')} | EL ${escapeHtml(block.el || '-')} | ${escapeHtml(item.reason || '未能标出')}</div>`;
        }).join('')
        : '';
      return `
        <div class="resultSection">
          <div class="resultSectionTitle">已识别记录</div>
          ${pageTextHtml || '<div class="resultMuted">暂无识别结果。</div>'}
        </div>
        <div class="resultSection">
          <div class="resultSectionTitle">跨页重复分图点</div>
          ${repeatedHtml}
        </div>
        <div class="resultSection">
          <div class="resultSectionTitle">未找到分图点的管线</div>
          ${missingHtml}
        </div>
        ${unmarkedHtml ? `
        <div class="resultSection">
          <div class="resultSectionTitle">已识别但未标出的坐标块</div>
          ${unmarkedHtml}
        </div>` : ''}
      `;
    }

    function renderResult(jobs) {
      el('result').innerHTML = buildResultHtml(jobs || []);

    async function writeRecognitionDebugLog(entry) {
      try {
        await fetch('/log-recognition', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)
        });
      } catch (error) {
        console.warn('写入识别日志失败:', error);
      }
    }

    function writeRecognitionJobsDebugLogs(jobs, reason = 'recognition') {
      (jobs || []).forEach(job => {
        writeRecognitionDebugLog({
          reason,
          page: job.page,
          sourcePdf: job.sourcePdf || (state.pdfFile ? state.pdfFile.name : ''),
          pipelineNumber: job.pipelineNumber || '',
          coordinateBlockCount: (job.coordinateBlocks || []).length,
          coordinateBlocks: job.coordinateBlocks || [],
          connectionMarkers: job.connectionMarkers || [],
          pipelineText: job.pipelineText || '',
          splitPointText: job.splitPointText || '',
          splitPointAttempts: job.splitPointAttempts || [],
          splitPointTileCount: job.splitPointTileCount || 0,
          splitPointCropMode: job.splitPointCropMode || '',
          raw: job.raw || null
        });
      });
    }

    function mergeCoordinateBlocks(existingBlocks, newBlocks) {
      const merged = new Map();
      [...(existingBlocks || []), ...(newBlocks || [])].forEach(block => {
        const key = block.key || `${block.e}|${block.s}|${block.el}`;
        if (!merged.has(key)) merged.set(key, { ...block, key });
      });
      return Array.from(merged.values());
    }

    function summarizeMarkdownDifference(previousText, currentText) {
      const previousLines = new Set(String(previousText || '').split(/\r?\n/).map(cleanLine).filter(Boolean));
      const currentLines = new Set(String(currentText || '').split(/\r?\n/).map(cleanLine).filter(Boolean));
      return {
        addedLines: Array.from(currentLines).filter(line => !previousLines.has(line)),
        missingLines: Array.from(previousLines).filter(line => !currentLines.has(line))
      };
    }

    function getMissingPipelinePages(jobs) {
      const missingPipelines = new Set(analyzeSplitPoints(jobs).missing.map(row => row.pipeline));
      return jobs
        .filter(job => job.pipelineNumber && missingPipelines.has(job.pipelineNumber))
        .map(job => job.page)
        .filter((page, index, pages) => pages.indexOf(page) === index)
        .sort((a, b) => a - b);
    }

    async function retryMissingSplitPointPages(maxRetries, signal, pageCanvasCache = null) {
      const getSourceCanvas = async pageNum => {
        if (pageCanvasCache && pageCanvasCache.has(pageNum)) return pageCanvasCache.get(pageNum);
        const sourceCanvas = await prepareRecognitionCanvas(pageNum);
        if (pageCanvasCache) pageCanvasCache.set(pageNum, sourceCanvas);
        return sourceCanvas;
      };
      for (let retry = 1; retry <= maxRetries; retry += 1) {
        throwIfAborted(signal);
        const retryPages = getMissingPipelinePages(lastRecognitionJobs);
        if (!retryPages.length) return;

        for (let index = 0; index < retryPages.length; index += 1) {
          throwIfAborted(signal);
          const pageNum = retryPages[index];
          const job = lastRecognitionJobs.find(item => item.page === pageNum);
          if (!job) continue;

          const progress = Math.round(((retry - 1) + index / retryPages.length) / maxRetries * 100);
          setStatus(`补识别第 ${retry}/${maxRetries} 轮: 第 ${pageNum} 页坐标块`, progress);
          const sourceCanvas = await getSourceCanvas(pageNum);
          const cropMode = retry === 1 ? 'retry1' : 'retry2';
          const splitPointUpload = await buildRegionPdfBlob('splitPoint', sourceCanvas, { cropMode });
          const splitPointResult = await submitRegionUploadCached(
            splitPointUpload,
            pageNum,
            `split-point-retry-${retry}`,
            'splitPoint',
            signal
          );
          const splitPointText = getMineruText(splitPointResult);
          const coordinateBlocks = extractCoordinateBlocks(splitPointText, { allowInferred: true });
          const connectionMarkers = extractConnectionMarkers(splitPointText, pageNum);
          const beforeCount = job.coordinateBlocks.length;
          const previousAttemptText = (job.splitPointAttempts || []).slice(-1)[0] || job.splitPointText || '';
          const markdownDifference = summarizeMarkdownDifference(previousAttemptText, splitPointText);
          job.coordinateBlocks = mergeCoordinateBlocks(job.coordinateBlocks, coordinateBlocks);
          job.connectionMarkers = [...(job.connectionMarkers || []), ...connectionMarkers]
            .filter((marker, index, list) =>
              list.findIndex(item => item.type === marker.type && item.page === marker.page && item.linkedPage === marker.linkedPage) === index
            );
          job.splitPointAttempts = [...(job.splitPointAttempts || []), splitPointText];

          writeRecognitionDebugLog({
            page: pageNum,
            sourcePdf: state.pdfFile ? state.pdfFile.name : '',
            pipelineNumber: job.pipelineNumber,
            retryRound: retry,
            retryReason: 'missing-cross-page-split-point',
            previousCoordinateBlockCount: beforeCount,
            retryCoordinateBlockCount: coordinateBlocks.length,
            mergedCoordinateBlockCount: job.coordinateBlocks.length,
            coordinateBlocks,
            connectionMarkers,
            splitPointText,
            markdownDifference,
            splitPointTileCount: splitPointUpload.pageCount,
            splitPointCropMode: splitPointUpload.cropMode,
            splitPointPayload: splitPointResult
          });
          renderResult(lastRecognitionJobs);
          if (state.pageNumber === pageNum) await refreshCoordinateOverlaysForCurrentPage();
        }
      }
    }

    async function recognizePagesLegacy(pageNums) {
      if (state.recognizing) return;
      recognitionController = new AbortController();
      const signal = recognitionController.signal;
      state.recognizing = true;
      await requestRecognitionWakeLock();
      setButtons();
      try {
        if (!state.pdfDoc) throw new Error('请先加载 PDF');
        if (!state.regions.pipelineNumber || !state.regions.splitPoint) throw new Error('请先框选管线号区域和分图点区域');
        el('exportExcel').disabled = true;
        lastRecognitionJobs = [];
        ocrMarkedPageOverlays.clear();
        ocrUnmarkedCoordinateBlocks = [];
        const total = pageNums.length;
        for (let idx = 0; idx < pageNums.length; idx += 1) {
        throwIfAborted(signal);
        const pageNum = pageNums[idx];
        state.pageNumber = pageNum;
        await renderPage();
        const sourceCanvas = await prepareRecognitionCanvas(pageNum);
        setStatus(`正在识别 ${idx + 1}/${total}: 第 ${pageNum} 页管线号`, Math.round(idx / total * 100));
        const pipelineUpload = await buildRegionPdfBlob('pipelineNumber', sourceCanvas);
        const pipelineResult = await submitRegionToMineru(pipelineUpload.blob, pageNum, 'pipeline-number', pipelineUpload.pageCount, signal);
        const pipelineText = getMineruText(pipelineResult);
        const pipelineNumber = findPipelineToken(pipelineText);
        setStatus(`正在识别 ${idx + 1}/${total}: 第 ${pageNum} 页坐标块`, Math.round((idx + 0.5) / total * 100));
        const splitPointUpload = await buildRegionPdfBlob('splitPoint', sourceCanvas);
        const splitPointResult = await submitRegionUpload(splitPointUpload, pageNum, 'split-point', signal);
        const splitPointText = getMineruText(splitPointResult);
        const coordinateBlocks = extractCoordinateBlocks(splitPointText, { allowInferred: true });
        const connectionMarkers = extractConnectionMarkers(splitPointText, pageNum);
        const previewCanvas = buildCombinedPreviewCanvas(sourceCanvas);
        const job = {
          page: pageNum,
          sourcePdf: state.pdfFile ? state.pdfFile.name : '',
          pipelineNumber,
          coordinateBlocks,
          connectionMarkers,
          pipelineText,
          splitPointText,
          splitPointAttempts: [splitPointText],
          splitPointTileCount: splitPointUpload.pageCount,
          splitPointCropMode: splitPointUpload.cropMode,
          raw: { pipeline: pipelineResult, splitPoint: splitPointResult }
        };
        lastRecognitionJobs.push(job);
        writeRecognitionDebugLog({
          page: pageNum,
          sourcePdf: state.pdfFile ? state.pdfFile.name : '',
          pipelineNumber,
          coordinateBlockCount: coordinateBlocks.length,
          coordinateBlocks,
          connectionMarkers,
          pipelineText,
          splitPointText,
          splitPointTileCount: splitPointUpload.pageCount,
          splitPointCropMode: splitPointUpload.cropMode,
          pipelinePayload: pipelineResult,
          splitPointPayload: splitPointResult,
          images: { combined: canvasToPngDataUrl(previewCanvas) }
        });
        renderResult(lastRecognitionJobs);
        if (state.pageNumber === pageNum) await refreshCoordinateOverlaysForCurrentPage();
        }
        await retryMissingSplitPointPages(2, signal);
        renderResult(lastRecognitionJobs);
        await refreshCoordinateOverlaysForCurrentPage();
        el('exportExcel').disabled = false;
        const remainingMissing = analyzeSplitPoints(lastRecognitionJobs).missing;
        setStatus(remainingMissing.length ? `识别完成，仍有 ${remainingMissing.length} 个管线未找全分图点` : '识别完成', 100);
      } catch (error) {
        if (error && error.name === 'AbortError') {
          setStatus('识别已停止', 0);
          return;
        }
        throw error;
      } finally {
        state.recognizing = false;
        recognitionController = null;
        await releaseRecognitionWakeLock();
        setButtons();
      }
    }

    async function mapWithConcurrency(items, limit, worker) {
      const results = new Array(items.length);
      let nextIndex = 0;
      const runners = Array.from(
        { length: Math.min(Math.max(1, limit), items.length) },
        async () => {
          while (nextIndex < items.length) {
            const index = nextIndex;
            nextIndex += 1;
            results[index] = await worker(items[index], index);
          }
        }
      );
      await Promise.all(runners);
      return results;
    }

    async function recognizePages(pageNums) {
      if (state.recognizing) return;
      recognitionController = new AbortController();
      const signal = recognitionController.signal;
      state.recognizing = true;
      await requestRecognitionWakeLock();
      setButtons();
      try {
        if (!state.pdfDoc) throw new Error('请先加载 PDF');

        }
        el('exportExcel').disabled = true;
        lastRecognitionJobs = [];

        ocrUnmarkedCoordinateBlocks = [];
        const pageCanvasCache = new Map();

          if (pageCanvasCache.has(pageNum)) return pageCanvasCache.get(pageNum);
          const sourceCanvas = await prepareRecognitionCanvas(pageNum);
          pageCanvasCache.set(pageNum, sourceCanvas);
          return sourceCanvas;
        };

        const total = pageNums.length;
        let pipelineCompleted = 0;
        lastRecognitionJobs = await mapWithConcurrency(pageNums, 1, async pageNum => {
          throwIfAborted(signal);
          const sourceCanvas = await getSourceCanvas(pageNum);
          const pipelineUpload = await buildRegionPdfBlob('pipelineNumber', sourceCanvas);
          const pipelineResult = await submitRegionUploadCached(

            'pipelineNumber',

          );
          const pipelineText = getMineruText(pipelineResult);
          const pipelineNumber = findPipelineToken(pipelineText);
          pipelineCompleted += 1;
          setStatus(
            `管线号识别 ${pipelineCompleted}/${total}（串行提交）`,
            Math.round(pipelineCompleted / Math.max(1, total) * 45)
          );
          writeRecognitionDebugLog({
            page: pageNum,
            sourcePdf: state.pdfFile ? state.pdfFile.name : '',
            pipelineNumber,
            recognitionStage: 'pipeline-only',
            pipelineText,
            pipelineTileCount: pipelineUpload.pageCount,
            pipelineCropMode: pipelineUpload.cropMode,
            pipelinePayload: pipelineResult,
            splitPointSkipped: true
          });
          return {
            page: pageNum,
            sourcePdf: state.pdfFile ? state.pdfFile.name : '',
            pipelineNumber,
            coordinateBlocks: [],
            connectionMarkers: [],
            pipelineText,
            splitPointText: '',
            splitPointAttempts: [],
            splitPointTileCount: 0,
            splitPointCropMode: '',
            raw: { pipeline: pipelineResult, splitPoint: null }
          };
        });
        lastRecognitionJobs.sort((a, b) => a.page - b.page);
        renderResult(lastRecognitionJobs);

        const pipelineCounts = new Map();
        lastRecognitionJobs.forEach(job => {
          if (!job.pipelineNumber) return;
          pipelineCounts.set(job.pipelineNumber, (pipelineCounts.get(job.pipelineNumber) || 0) + 1);
        });
        let splitPointJobs = lastRecognitionJobs.filter(job =>
          job.pipelineNumber && (pipelineCounts.get(job.pipelineNumber) || 0) > 1
        );
        if (!splitPointJobs.length) {
          splitPointJobs = lastRecognitionJobs.filter(job => job.pipelineNumber);
        }

        let splitCompleted = 0;
        await mapWithConcurrency(splitPointJobs, 1, async job => {
          throwIfAborted(signal);
          const sourceCanvas = await getSourceCanvas(job.page);
          const splitPointUpload = await buildRegionPdfBlob('splitPoint', sourceCanvas);
          const splitPointResult = await submitRegionUploadCached(
            splitPointUpload,
            job.page,
            'split-point',
            'splitPoint',
            signal
          );
          const splitPointText = getMineruText(splitPointResult);
          const coordinateBlocks = extractCoordinateBlocks(splitPointText, { allowInferred: true });
          const connectionMarkers = extractConnectionMarkers(splitPointText, job.page);
          const previewCanvas = buildCombinedPreviewCanvas(sourceCanvas);
          Object.assign(job, {
            coordinateBlocks,
            connectionMarkers,
            splitPointText,
            splitPointAttempts: [splitPointText],
            splitPointTileCount: splitPointUpload.pageCount,
            splitPointCropMode: splitPointUpload.cropMode,
            raw: { ...job.raw, splitPoint: splitPointResult }
          });
          splitCompleted += 1;
          setStatus(
            `重复管线坐标识别 ${splitCompleted}/${splitPointJobs.length}（串行提交）`,
            45 + Math.round(splitCompleted / Math.max(1, splitPointJobs.length) * 45)
          );
          writeRecognitionDebugLog({
            page: job.page,
            sourcePdf: job.sourcePdf,
            pipelineNumber: job.pipelineNumber,
            coordinateBlockCount: coordinateBlocks.length,
            coordinateBlocks,
            connectionMarkers,
            pipelineText: job.pipelineText,
            splitPointText,
            splitPointTileCount: splitPointUpload.pageCount,
            splitPointCropMode: splitPointUpload.cropMode,
            pipelinePayload: job.raw.pipeline,
            splitPointPayload: splitPointResult,
            images: { combined: canvasToPngDataUrl(previewCanvas) }
          });
          renderResult(lastRecognitionJobs);
        });

        await retryMissingSplitPointPages(2, signal, pageCanvasCache);
        renderResult(lastRecognitionJobs);
        await refreshCoordinateOverlaysForCurrentPage();
        el('exportExcel').disabled = false;
        const remainingMissing = analyzeSplitPoints(lastRecognitionJobs).missing;
        setStatus(
          remainingMissing.length
            ? `识别完成，仍有 ${remainingMissing.length} 个管线未找全分图点`
            : `识别完成；${total - splitPointJobs.length} 个非重复管线页已跳过坐标识别`,
          100
        );
      } catch (error) {
        if (error && error.name === 'AbortError') {
          setStatus('识别已停止', 0);
          return;
        }
        throw error;
      } finally {
        state.recognizing = false;
        recognitionController = null;
        await releaseRecognitionWakeLock();
        setButtons();
      }
    }

    async function recognizePagesBackend(pageNums) {
      if (state.recognizing) return;
      recognitionController = new AbortController();
      const signal = recognitionController.signal;
      state.recognizing = true;
      await requestRecognitionWakeLock();
      setButtons();
      try {
        if (!state.pdfDoc) throw new Error('请先加载 PDF');
        if (!state.regions.pipelineNumber || !state.regions.splitPoint) {
          throw new Error('请先框选管线号区域和分图点区域');
        }
        el('exportExcel').disabled = true;
        lastRecognitionJobs = [];
        ocrMarkedPageOverlays.clear();
        ocrUnmarkedCoordinateBlocks = [];
        activeBackendRecognitionJobId = null;
        const pageCanvasCache = new Map();
        const uploads = [];
        for (let index = 0; index < pageNums.length; index += 1) {
          throwIfAborted(signal);
          const pageNum = pageNums[index];
          setStatus(`准备后台识别数据 ${index + 1}/${pageNums.length}`, Math.round((index + 1) / Math.max(1, pageNums.length) * 12));
          uploads.push(await buildBackendRecognitionUpload(pageNum, signal, pageCanvasCache));
        }

        setStatus('识别任务已提交后台，切走页面后服务端仍会继续处理', 15);
        activeBackendRecognitionJobId = await startBackendRecognitionJob(pageNums, uploads, signal);
        const backendResults = await waitBackendRecognitionJob(activeBackendRecognitionJobId, signal);
        lastRecognitionJobs = hydrateBackendRecognitionJobs(backendResults);
        writeRecognitionJobsDebugLogs(lastRecognitionJobs, 'backend-recognition-done');
        renderResult(lastRecognitionJobs);
        await retryMissingSplitPointPages(2, signal, pageCanvasCache);
        renderResult(lastRecognitionJobs);
        await refreshCoordinateOverlaysForCurrentPage();
        el('exportExcel').disabled = false;
        const remainingMissing = analyzeSplitPoints(lastRecognitionJobs).missing;
        setStatus(remainingMissing.length ? `识别完成，仍有 ${remainingMissing.length} 条缺失记录` : '识别完成', 100);
      } catch (error) {
        if (error && error.name === 'AbortError') {
          setStatus('识别已停止', 0);
          return;
        }
        throw error;
      } finally {
        state.recognizing = false;
        recognitionController = null;
        activeBackendRecognitionJobId = null;
        await releaseRecognitionWakeLock();
        setButtons();
      }
    }

    function parsePageRange(text) {
      const total = state.totalPages || 0;
      const pages = new Set();
      String(text || '').split(/[,\s，]+/).forEach(part => {
        if (!part) return;
        const range = part.match(/^(\d+)\s*[-~]\s*(\d+)$/);
        if (range) {
          const start = Number(range[1]);
          const end = Number(range[2]);
          for (let p = Math.min(start, end); p <= Math.max(start, end); p += 1) {
            if (p >= 1 && p <= total) pages.add(p);
          }
        } else {
          const p = Number(part);
          if (p >= 1 && p <= total) pages.add(p);
        }
      });
      return Array.from(pages).sort((a, b) => a - b);
    }

        function exportExcel() {
      const { repeated, missing } = analyzeSplitPoints(lastRecognitionJobs);
      const wb = XLSX.utils.book_new();
      const exactRows = repeated.filter(row => row.elDifference == null);
      const toleranceRows = repeated.filter(row => row.elDifference != null);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exactRows.map(row => ({
        管线号: row.pipeline,
        E: row.e,
        S: row.s,
        EL: row.el,
        页码: row.pages
      }))), '分图点');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(toleranceRows.map(row => {
        const targets = normalizeRowCoordinateTargets(row);
        const first = targets[0] || row;
        const second = targets[1] || {};
        return {
          管线号: row.pipeline,
          坐标1页码: first.page || '',
          E1: first.e || '',
          S1: first.s || '',
          EL1: first.el || '',
          坐标2页码: second.page || '',
          E2: second.e || '',
          S2: second.s || '',
          EL2: second.el || '',
          匹配页码: row.pages,
          EL差值: row.elDifference
        };
      })), '特殊分图点');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(missing.map(row => ({
        管线号: row.pipeline,
        所有页码: row.pages,
        出现页数: row.pageCount,
        空坐标页: row.emptyCoordinatePages,
        应有分图点: row.expected,
        已找到: row.found,
        缺少: row.missing
      }))), '未找到分图点');
      const sourceName = String(state.pdfFile?.name || '未命名PDF')
        .replace(/\.pdf$/i, '')
        .replace(/[\\/:*?"<>|]/g, '_')
        .trim() || '未命名PDF';
      const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      const name = `分图点识别结果_${sourceName}_${timestamp}.xlsx`;
      XLSX.writeFile(wb, name);
    }

    function pointerToRelative(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
        y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height))
      };
    }

    el('overlay').addEventListener('pointerdown', event => {
      if (!state.pdfDoc) return;
      el('overlay').setPointerCapture(event.pointerId);
      const p = pointerToRelative(event);
      state.dragging = { start: p, current: p };
      drawRegions();
    });
    el('overlay').addEventListener('pointermove', event => {
      if (!state.dragging) return;
      state.dragging.current = pointerToRelative(event);
      drawRegions();
    });
    el('overlay').addEventListener('pointerup', event => {
      if (!state.dragging) return;
      state.dragging.current = pointerToRelative(event);
      const region = normalizeRegion(state.dragging.start, state.dragging.current);
      state.dragging = null;
      if (region && region.width > 0.002 && region.height > 0.002) {
        state.regions[state.activeRegionType] = region;
        ocrMarkedPageOverlays.clear();
        ocrUnmarkedCoordinateBlocks = [];
        persistRegionTemplate();
      }
      drawRegions();
    });

    el('pdfFileInput').addEventListener('change', event => {
      const file = event.target.files && event.target.files[0];
      if (file) loadPdf(file).catch(error => setStatus(`PDF 加载失败: ${error.message}`, 0));
    });
    el('regionType').addEventListener('change', event => state.activeRegionType = event.target.value);
    el('selectSplitPointRegion').addEventListener('click', () => {
      state.activeRegionType = 'splitPoint';
      el('regionType').value = 'splitPoint';
      setStatus('请在 PDF 上拖拽框选分图点区域', 0);
      setButtons();
    });
    el('selectPipelineRegion').addEventListener('click', () => {
      state.activeRegionType = 'pipelineNumber';
      el('regionType').value = 'pipelineNumber';
      setStatus('请在 PDF 上拖拽框选管线号区域', 0);
      setButtons();
    });
    el('clearRegions').addEventListener('click', () => {
      state.regions = { splitPoint: null, pipelineNumber: null };
      ocrMarkedPageOverlays.clear();
      ocrUnmarkedCoordinateBlocks = [];
      localStorage.removeItem(REGION_TEMPLATE_STORAGE_KEY);
      drawRegions();
    });
    el('exportRegionTemplate').addEventListener('click', exportRegionTemplate);
    el('importRegionTemplate').addEventListener('click', () => el('regionTemplateFile').click());
    el('regionTemplateFile').addEventListener('change', async event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        applyRegionTemplate(JSON.parse(await file.text()));
        setStatus('识别模板已导入', 100);
      } catch (error) {
        setStatus(`模板导入失败: ${error.message}`, 0);
      } finally {
        event.target.value = '';
      }
    });
    el('prevPage').addEventListener('click', () => {
      if (state.pageNumber > 1) { state.pageNumber -= 1; renderPage(); }
    });
    el('nextPage').addEventListener('click', () => {
      if (state.pageNumber < state.totalPages) { state.pageNumber += 1; renderPage(); }
    });
    el('pageInput').addEventListener('change', event => {
      const p = Math.max(1, Math.min(state.totalPages, Number(event.target.value) || 1));
      state.pageNumber = p;
      renderPage();
    });
    el('zoomSelect').addEventListener('change', event => {
      state.displayScale = Number(event.target.value) || 1;
      renderPage();
    });
    el('zoomIn').addEventListener('click', () => {
      state.displayScale = Math.min(3, state.displayScale + 0.25);
      el('zoomSelect').value = String(state.displayScale);
      renderPage();
    });
    el('zoomOut').addEventListener('click', () => {
      state.displayScale = Math.max(0.5, state.displayScale - 0.25);
      el('zoomSelect').value = String(state.displayScale);
      renderPage();
    });
    el('runCurrentPage').addEventListener('click', () => recognizePagesBackend([state.pageNumber]).catch(error => setStatus(`识别失败: ${error.message}`, 0)));
    el('runAllPages').addEventListener('click', () => recognizePagesBackend(Array.from({ length: state.totalPages }, (_, i) => i + 1)).catch(error => setStatus(`识别失败: ${error.message}`, 0)));
    el('stopRecognition').addEventListener('click', () => {
      if (!state.recognizing || !recognitionController) return;
      setStatus('正在停止识别...', 0);
      cancelBackendRecognitionJob(activeBackendRecognitionJobId);
      recognitionController.abort();
    });
    el('runPageRange').addEventListener('click', () => {
      const pages = parsePageRange(el('pageRangeInput').value);
      if (!pages.length) return setStatus('请填写有效页码范围', 0);
      recognizePagesBackend(pages).catch(error => setStatus(`识别失败: ${error.message}`, 0));
    });
    el('exportExcel').addEventListener('click', exportExcel);
    el('markCoordinateBoxes').addEventListener('click', () => {
      markCoordinateBoxesWithOcr().catch(error => setStatus(`OCR 标框失败: ${error.message}`, 0));
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.recognizing) {
        requestRecognitionWakeLock();
      }
    });

    restoreSavedRegionTemplate();
    setButtons();
    updateRegionInfo();
  </script>
</body>
</html>
