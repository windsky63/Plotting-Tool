<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="weldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#faad14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffd666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#faad14;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="8"/>
  
  <!-- PDF文档图标 -->
  <rect x="160" y="120" width="192" height="240" rx="12" ry="12" fill="#ffffff" stroke="#e6f7ff" stroke-width="2"/>
  <rect x="160" y="120" width="192" height="48" rx="12" ry="12" fill="#f0f0f0"/>
  
  <!-- PDF文字 -->
  <text x="256" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#595959">PDF</text>
  
  <!-- 焊接符号和管道线 -->
  <!-- 主管道线 -->
  <line x1="180" y1="220" x2="332" y2="220" stroke="#262626" stroke-width="4"/>
  <line x1="180" y1="260" x2="332" y2="260" stroke="#262626" stroke-width="4"/>
  <line x1="180" y1="300" x2="332" y2="300" stroke="#262626" stroke-width="4"/>
  
  <!-- 焊接点 -->
  <circle cx="220" cy="220" r="6" fill="url(#weldGradient)" stroke="#d48806" stroke-width="2"/>
  <circle cx="280" cy="260" r="6" fill="url(#weldGradient)" stroke="#d48806" stroke-width="2"/>
  <circle cx="240" cy="300" r="6" fill="url(#weldGradient)" stroke="#d48806" stroke-width="2"/>
  
  <!-- 焊接符号 -->
  <path d="M 210 210 L 230 210 L 220 200 Z" fill="url(#weldGradient)" stroke="#d48806" stroke-width="1"/>
  <path d="M 270 250 L 290 250 L 280 240 Z" fill="url(#weldGradient)" stroke="#d48806" stroke-width="1"/>
  <path d="M 230 290 L 250 290 L 240 280 Z" fill="url(#weldGradient)" stroke="#d48806" stroke-width="1"/>
  
  <!-- 标注文字 -->
  <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d48806">01</text>
  <text x="260" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d48806">02</text>
  <text x="220" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d48806">03</text>
  
  <!-- 工具图标 -->
  <g transform="translate(300, 320)">
    <!-- 标注笔 -->
    <path d="M 0 0 L 20 0 L 25 5 L 25 15 L 20 20 L 0 20 Z" fill="#52c41a" stroke="#389e0d" stroke-width="2"/>
    <circle cx="10" cy="10" r="3" fill="#ffffff"/>
    <path d="M 25 5 L 35 -5 L 40 0 L 30 10 Z" fill="#faad14" stroke="#d48806" stroke-width="1"/>
  </g>
</svg>